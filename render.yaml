# =====================================================
# Render Blueprint — WhakaChile CRM + WMS (monorepo)
# =====================================================
# Conecta el repo en render.com → New → Blueprint
# Render detecta este archivo automáticamente.
# =====================================================

databases:
  - name: whakachile-db
    plan: free
    databaseName: whakachile
    user: whakachile

services:

  # ── Backend WMS (Express / TypeScript) ──────────────
  - type: web
    name: whakachile-wms
    runtime: node
    plan: free
    rootDir: wms
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma db push --skip-generate && npx tsx prisma/seed.ts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whakachile-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 4h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Redis no requerido para la maqueta
      - key: REDIS_HOST
        value: ""
      # APIs externas (maqueta usa datos mock)
      - key: BSALE_ACCESS_TOKEN
        value: mock
      - key: SHOPIFY_ACCESS_TOKEN
        value: mock
      - key: SYNCMANAGER_API_KEY
        value: mock

  # ── Frontend CRM (React / Vite — servido con `serve`) ──
  # Render no soporta type:static en blueprints; se usa type:web + serve
  - type: web
    name: whakachile-crm
    runtime: node
    plan: free
    rootDir: crm
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_MAPBOX_TOKEN
        value: pk.eyJ1IjoiZmd1YWphcmRvcyIsImEiOiJjbW1waGR2azgwcXB1MnFxMHhlbGRwejZxIn0.jbxHv5KT4XYPLbx8_FjmtQ
      # Completar con las URLs asignadas por Render tras el primer deploy
      - key: VITE_WMS_URL
        value: https://whakachile-wms.onrender.com
      - key: VITE_CRM_URL
        value: https://whakachile-crm.onrender.com
