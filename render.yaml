# =====================================================
# Render Blueprint — WhakaChile CRM + WMS (monorepo)
# =====================================================
# En render.com → New → Blueprint → conectar este repo.
#
# Base de datos: NEON (ya en la nube, con todos los datos del demo:
# catálogo açaí, ofertas, leads, clientes). NO se crea una DB nueva.
#
# Único secreto a pegar en el dashboard (marcado sync:false):
#   - DATABASE_URL  → copiar la cadena de Neon desde wms/.env
# (JWT_SECRET y JWT_REFRESH_SECRET los genera Render automáticamente)
# =====================================================

services:

  # ── Backend WMS (Express / TypeScript / Prisma) ──────
  - type: web
    name: whakachile-wms
    runtime: node
    plan: free
    region: oregon
    rootDir: wms
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # ← pegar la URL de Neon (de wms/.env)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 4h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Redis no requerido (las colas se desactivan solas)
      - key: REDIS_HOST
        value: ""
      # APIs externas (la maqueta no las usa)
      - key: BSALE_ACCESS_TOKEN
        value: mock
      - key: SHOPIFY_ACCESS_TOKEN
        value: mock
      - key: SYNCMANAGER_API_KEY
        value: mock

  # ── Frontend CRM (React / Vite — sitio estático) ─────
  - type: web
    name: whakachile-crm
    runtime: static
    rootDir: crm
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      # URL pública del backend (ajustar si Render asigna otro nombre al WMS)
      - key: VITE_WMS_URL
        value: https://whakachile-wms.onrender.com
      - key: VITE_CRM_URL
        value: https://whakachile-crm.onrender.com
      - key: VITE_MAPBOX_TOKEN
        value: pk.eyJ1IjoiZmd1YWphcmRvcyIsImEiOiJjbW1waGR2azgwcXB1MnFxMHhlbGRwejZxIn0.jbxHv5KT4XYPLbx8_FjmtQ
    routes:
      # SPA fallback (para que F5 funcione en subrutas)
      - type: rewrite
        source: /*
        destination: /index.html
